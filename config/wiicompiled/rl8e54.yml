    load_address: 0x80575580
    bss_address: 0x8102B0C0

translation:
  entry_points:
    - 0x8000403C
    - 0x80AA0718
  function_map:
    # Function addresses and names only (dtk boundaries + SDK identification); regenerate with
    # tools/wiicompiled-translate.ps1 -RegenerateMap.
    path: config/wiicompiled/rl8e54-functions.map
  # Measure instead of aborting on the first unsupported instruction.
  allow_unsupported_instructions: true
  # Season mode cap compares (index 9 = last season, 10 = number of seasons), found by
  # tools/season_cap_sites.py; the runtime answers them from the SEASONS option
  # (hle/mlb/season_cap.cpp, docs/superpowers/plans/2026-10-19-season-20-build.md).
  immediate_overrides:
    - {address: 0x80BB4A6C, expect: 9}    # index == 9: message 141
    - {address: 0x80BF2530, expect: 9}    # index < 9: calls 0x80BF619C
    - {address: 0x80BF51BC, expect: 9}    # off-season events, index < 9
    - {address: 0x80BF52D0, expect: 9}    # off-season events, index < 9
    - {address: 0x80C0CC0C, expect: 10}   # index < 10
    # Season mode games' DH flag (hle/mlb/season_cap.cpp, IsDhSite): 1 with the universal DH.
    - {address: 0x80B6F210, expect: 0}    # stb of (home team's league == 0) in 0x80B6F00C: OR-ed with it
    - {address: 0x80B6EF88, expect: 0}    # li r0, 0 (no DH) in 0x80B6EEAC
    # Year sites (tools/season_cap_sites.py --years): with no limit they move with the year offset.
    # 0x80B4A730, the season's year for a date: 2007 or 2008 + index, at least 2008.
    - {address: 0x80B4A7A0, expect: 2007}
    - {address: 0x80B4A7AC, expect: 2008}
    - {address: 0x80B4A7B0, expect: 2008}
    - {address: 0x80B4A7B4, expect: 2008}
    - {address: 0x8087B808, expect: 2008}  # 2008 + index into a UI object
    - {address: 0x8087E3B8, expect: 2008}  # same
    - {address: 0x80ADC658, expect: 2008}  # a year picker: 2008 + the picked index
    # The calendar clamps the 2-digit year (index + 8) to 28 before its day-of-week formula.
    - {address: 0x80B4AF20, expect: 28}
    - {address: 0x80B4AF24, expect: 28}
    - {address: 0x80B4B148, expect: 28}
    - {address: 0x80B4B14C, expect: 28}
